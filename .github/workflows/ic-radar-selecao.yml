# Rotina ic-radar-selecao: código em zarkatus/innconta-site; roda AQUI (repo público, Actions grátis) via scripts/rodar_rotina.py.
# Migrada em 17/10/2026 de innconta-site/.github/workflows/radar-selecao.yml.
# Disparo: agendador em corrente (rotinas.json). Log mudo; falha vai à central técnica (ntfy).
name: Radar · seleção diária
run-name: "Radar · seleção diária${{ inputs.ensaio == 'true' && ' (ensaio)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'true = modo ensaio do script (não envia / só lê)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: ic-radar-selecao
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar a rotina (log mudo; falha vai à central técnica)
        env:
          DEPLOY_KEYS: ${{ secrets.DEPLOY_KEYS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          OPS_ENSAIO: ${{ inputs.ensaio }}
          HC_PING_RADAR_SELECAO: ${{ secrets.HC_PING_RADAR_SELECAO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SO_LER: ${{ inputs.ensaio == 'true' && '--so-ler' || '' }}
          RADAR_UFS: "SC,PR,RS,SP"
          RADAR_MIN_REAIS: "1000000"
          RADAR_META: "40"
        run: python3 scripts/rodar_rotina.py ic-radar-selecao
