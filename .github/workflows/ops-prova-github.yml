# Rotina ops-prova-github: código em zarkatus/innconta-site; roda AQUI (repo público, Actions grátis) via scripts/rodar_rotina.py.
# Criada em 30/10/2026 (revezamento, fio prospeccao-parceiros-email-qualidade): sentinela diária do executor github no livro ops_execucao.
# Disparo: agendador em corrente (rotinas.json). Log mudo; falha vai à central técnica (ntfy).
name: Revezamento · sentinela do executor github
run-name: "Revezamento · sentinela do executor github${{ inputs.ensaio == 'true' && ' (ensaio)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'true = modo ensaio do script (não envia / só lê)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: ops-prova-github
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar a rotina (log mudo; falha vai à central técnica)
        env:
          DEPLOY_KEYS: ${{ secrets.DEPLOY_KEYS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          OPS_ENSAIO: ${{ inputs.ensaio }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/rodar_rotina.py ops-prova-github
