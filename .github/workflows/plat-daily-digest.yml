# Rotina plat-daily-digest: código em zarkatus/innovasphere-platform; roda AQUI (repo público, Actions grátis) via scripts/rodar_rotina.py.
# Migrada em 17/10/2026 de innovasphere-platform/.github/workflows/daily-digest.yml.
# Disparo: agendador em corrente (rotinas.json). Log mudo; falha vai à central técnica (ntfy).
name: Daily Digest CVO
run-name: "Daily Digest CVO${{ inputs.ensaio == 'true' && ' (ensaio)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'true = modo ensaio do script (não envia / só lê)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: plat-daily-digest
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar a rotina (log mudo; falha vai à central técnica)
        env:
          DEPLOY_KEYS: ${{ secrets.DEPLOY_KEYS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SUPABASE_URL: ${{ secrets.PLAT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAT_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_MANAGEMENT_PAT: ${{ secrets.PLAT_SUPABASE_MANAGEMENT_PAT }}
          RESEND_API_KEY: ${{ secrets.PLAT_RESEND_API_KEY }}
          DRY_FLAG: ${{ inputs.ensaio == 'true' && '--dry-run' || '' }}
        run: python3 scripts/rodar_rotina.py plat-daily-digest
