# Rotina plat-ia-worker: código em zarkatus/innovasphere-platform; roda AQUI (repo público, Actions grátis) via scripts/rodar_rotina.py.
# Migrada em 17/10/2026 de innovasphere-platform/.github/workflows/ia-worker.yml.
# Disparo: agendador em corrente (rotinas.json). Log mudo; falha vai à central técnica (ntfy).
name: IA da casa (worker)
run-name: "IA da casa (worker)${{ inputs.ensaio == 'true' && ' (ensaio)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'true = modo ensaio do script (não envia / só lê)'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: plat-ia-worker
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar a rotina (log mudo; falha vai à central técnica)
        env:
          DEPLOY_KEYS: ${{ secrets.DEPLOY_KEYS }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SUPABASE_URL: ${{ secrets.PLAT_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PLAT_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.PLAT_SUPABASE_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python3 scripts/rodar_rotina.py plat-ia-worker
