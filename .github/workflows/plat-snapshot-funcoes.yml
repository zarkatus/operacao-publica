# Rotina plat-snapshot-funcoes: código no repo privado; roda AQUI (repo público, Actions grátis) via scripts/rodar_rotina.py.
# Migrada em 17/10/2026 de innovasphere-platform/.github/workflows/snapshot-funcoes.yml (Actions privado parado por cobrança; CVO 17/10: custo zero, sem regularizar).
# Comita de volta no repo privado: usa DEPLOY_KEYS_ESCRITA (só os workflows das rotinas com "escrita": true).
# Disparo: agendador em corrente (rotinas.json). Log mudo; falha vai à central técnica (ntfy).
name: Retrato semanal das funções (plataforma)
run-name: "Retrato semanal das funções (plataforma)${{ inputs.ensaio == 'true' && ' (ensaio)' || '' }}"
on:
  workflow_dispatch:
    inputs:
      ensaio:
        description: 'sem efeito: o retrato só lê o banco e comita se mudou'
        required: false
        default: 'false'
permissions:
  contents: read
concurrency:
  group: plat-snapshot-funcoes
  cancel-in-progress: false
jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar a rotina (log mudo; falha vai à central técnica)
        env:
          DEPLOY_KEYS_ESCRITA: ${{ secrets.DEPLOY_KEYS_ESCRITA }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          SUPABASE_MANAGEMENT_PAT: ${{ secrets.PLAT_SUPABASE_MANAGEMENT_PAT }}
          RESEND_API_KEY: ${{ secrets.PLAT_RESEND_API_KEY }}
        run: python3 scripts/rodar_rotina.py plat-snapshot-funcoes
